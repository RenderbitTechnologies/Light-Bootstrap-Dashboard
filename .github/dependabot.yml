version: 2

updates:
  # This is a library with no composer.lock, so widen the version constraints
  # in composer.json to allow new releases instead of dropping older ones.
  - package-ecosystem: composer
    directory: /
    schedule:
      interval: weekly
    versioning-strategy: widen
    commit-message:
      prefix: chore(deps)

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci(deps)
    groups:
      github-actions:
        patterns:
          - "*"
