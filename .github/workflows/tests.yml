name: Tests

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: PHP ${{ matrix.php }} / Laravel ${{ matrix.laravel }}
    runs-on: ubuntu-latest

    env:
      # Every release of the older Laravel versions in this matrix has a
      # published security advisory, and Composer >= 2.9 refuses to install
      # them by default. This job only checks that the package works with
      # those versions, so allow them here.
      COMPOSER_NO_BLOCKING: 1
      COMPOSER_NO_SECURITY_BLOCKING: 1

    strategy:
      fail-fast: false
      matrix:
        include:
          - { laravel: '5.7', testbench: '3.7.*', php: '7.4' }
          - { laravel: '5.8', testbench: '3.8.*', php: '7.4' }
          - { laravel: '6', testbench: '4.*', php: '7.4' }
          - { laravel: '6', testbench: '4.*', php: '8.0' }
          - { laravel: '7', testbench: '5.*', php: '7.4' }
          - { laravel: '7', testbench: '5.*', php: '8.0' }
          - { laravel: '8', testbench: '6.*', php: '7.4' }
          - { laravel: '8', testbench: '6.*', php: '8.1' }
          - { laravel: '9', testbench: '7.*', php: '8.0' }
          - { laravel: '9', testbench: '7.*', php: '8.2' }
          - { laravel: '10', testbench: '8.*', php: '8.1' }
          - { laravel: '10', testbench: '8.*', php: '8.3' }
          - { laravel: '11', testbench: '9.*', php: '8.2' }
          - { laravel: '11', testbench: '9.*', php: '8.4' }
          - { laravel: '12', testbench: '10.*', php: '8.2' }
          - { laravel: '12', testbench: '10.*', php: '8.4' }

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, pdo_sqlite
          coverage: none

      - name: Install dependencies
        run: |
          composer require "orchestra/testbench:${{ matrix.testbench }}" --dev --no-update --no-interaction
          composer update --prefer-dist --no-interaction --no-progress --with-all-dependencies

      - name: Run tests
        run: composer test

  style:
    name: Code style (PSR-2)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Check code style
        run: composer check-style
