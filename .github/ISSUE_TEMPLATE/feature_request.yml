name: Feature request
description: Suggest a new view, component, config option, or improvement
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the suggestion. Please describe the problem you are trying to solve, not only the solution you have in mind.

  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Why is the current behaviour limiting? How would you use the change?
      placeholder: I need a dark navbar variant, but the published views hard-code the light theme.
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: Sketch the API, config key, or Blade component you expect.
      placeholder: A `navbar.dark` config flag consumed by `inc/navbar.blade.php`.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Workarounds you tried, or other approaches that could work.
    validations:
      required: false

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Blade view or layout
        - Config / customisation
        - Published assets (CSS, JS, fonts)
        - Documentation
        - Package internals (service provider, helpers, routes)
        - Other
    validations:
      required: true

  - type: dropdown
    id: breaking
    attributes:
      label: Would this break existing behaviour?
      description: The project follows SemVer, so breaking changes need a major release.
      options:
        - No
        - Yes
        - Not sure
    validations:
      required: true

  - type: textarea
    id: extra
    attributes:
      label: Additional context
      description: Mockups, links to similar implementations, or related issues.
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I have searched existing issues and this is not a duplicate.
          required: true
        - label: I am willing to open a pull request for this.
          required: false
